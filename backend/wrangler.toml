name = "resume-analytics"
main = "worker.mjs"
compatibility_date = "2026-10-25"
workers_dev = true

[vars]
SITE_ORIGIN = "https://kosj.github.io"
BASE_PATH = "/Resume/"

[[d1_databases]]
binding = "DB"
database_name = "resume-analytics"
# Production D1 database (identifier only; not a credential).
database_id = "20bff3db-1d73-4f8d-ae0a-09611f9612e7"
migrations_dir = "migrations"

[triggers]
crons = ["17 18 * * *"]

# Keep telemetry payloads / administrator headers out of Worker invocation logs.
[observability]
enabled = false
